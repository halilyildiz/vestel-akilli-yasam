apply:
  name: Apply appliance setting
  description: Apply a discovery-defined setting or command; raw commands are not
    accepted.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    command:
      name: Full discovery command key
      selector:
        text: null
    updates:
      name: Setting changes (key and value)
      selector:
        object: null
get_consumption:
  name: Get consumption history
  description: Read estimated energy, cost and water history without changing appliance
    settings.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    period:
      name: Period
      default: month
      selector:
        select:
          options:
          - day
          - week
          - month
          translation_key: period
    count:
      name: Number of periods
      default: 12
      selector:
        number:
          min: 1
          max: 366
          mode: box
get_billing_settings:
  name: Get billing estimate settings
  description: Read the device limit and home tariff and unit-price settings.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
set_bill_limit:
  name: Set bill limit
  description: Change the selected device or home estimate limit. The other scope
    is preserved.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    scope:
      name: Limit scope
      default: device
      selector:
        select:
          options:
          - device
          - home
          translation_key: scope
    amount:
      name: Limit amount
      required: true
      selector:
        number:
          min: 0
          mode: box
          step: 1
    enabled:
      name: Enabled
      required: true
      selector:
        boolean: null
set_energy_price:
  name: Set energy price
  description: Change the kWh price and currency for all estimates in this home, not
    the electricity supplier contract.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    price:
      name: Price per kWh
      required: true
      selector:
        number:
          min: 0
          mode: box
          step: 0.001
    currency:
      name: Currency code (for example TRY)
      required: true
      selector:
        text: null
set_subscriber_type:
  name: Set subscriber type
  description: Change the subscriber type used for this home’s billing estimates.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    subscriber_type:
      name: Subscriber type
      required: true
      selector:
        select:
          options:
          - residential
          - business
          - industrial
          translation_key: subscriber_type
set_tariff_type:
  name: Set tariff type
  description: Change this home’s estimate tariff to one-time or three-time.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    tariff_type:
      name: Tariff type
      required: true
      selector:
        select:
          options:
          - one-time
          - three-time
          translation_key: tariff_type
set_energy_management:
  name: Set energy management
  description: Enable or disable the home’s billing estimate feature; this does not
    turn appliances on or off.
  fields:
    device_id:
      name: Vestel appliance
      required: true
      selector:
        device:
          integration: vestel_appliances
    enabled:
      name: Enabled
      required: true
      selector:
        boolean: null
