apply:
  name: Cihaz ayarını değiştir
  description: Cihazın keşif tanımındaki bir ayarı veya işlemi uygular. Ham komut kabul etmez.
  fields:
    device_id:
      name: Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    command:
      name: İşlemin tam Vestel anahtarı
      selector:
        text:
    updates:
      name: Değiştirilecek ayarlar (key ve value)
      selector:
        object:
get_consumption:
  name: Tüketim geçmişini getir
  description: Vestel uygulamasının tahmini enerji, maliyet ve su geçmişini sorgular; cihaz ayarı değiştirmez.
  fields:
    device_id:
      name: Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    period:
      name: Dönem
      default: month
      selector:
        select:
          options:
            - day
            - week
            - month
    count:
      name: Dönem sayısı
      default: 12
      selector:
        number:
          min: 1
          max: 366
          mode: box
get_billing_settings:
  name: Akıllı Fatura ayarlarını getir
  description: Seçilen cihazın limitini ve evin tarife/birim fiyat ayarlarını okur.
  fields:
    device_id:
      name: Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
set_bill_limit:
  name: Fatura limitini ayarla
  description: Seçilen kapsamda cihazın veya evin uygulamadaki fatura limitini değiştirir. Diğer kapsamın limiti korunur.
  fields:
    device_id:
      name: Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    scope:
      name: Limit kapsamı
      default: device
      selector:
        select:
          options:
            - label: Seçilen cihaz
              value: device
            - label: Bu cihazın bulunduğu ev
              value: home
    amount:
      name: Limit tutarı
      required: true
      selector:
        number:
          min: 0
          mode: box
          step: 1
    enabled:
      name: Limit etkin
      required: true
      selector:
        boolean:
set_energy_price:
  name: Elektrik birim fiyatını ayarla
  description: Evin tüm Vestel tüketim hesaplarında kullanılan kWh fiyatını ve para birimini değiştirir. Elektrik tedarikçisiyle sözleşme değişikliği yapmaz.
  fields:
    device_id:
      name: Bu evdeki bir Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    price:
      name: kWh başına fiyat
      required: true
      selector:
        number:
          min: 0
          mode: box
          step: 0.001
    currency:
      name: Para birimi (örneğin TRY)
      required: true
      selector:
        text:
set_subscriber_type:
  name: Abonelik türünü ayarla
  description: Evin Akıllı Fatura hesaplamasında kullanılan abonelik türünü değiştirir.
  fields:
    device_id:
      name: Bu evdeki bir Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    subscriber_type:
      name: Abonelik türü
      required: true
      selector:
        select:
          options:
            - label: Mesken
              value: residential
            - label: Ticarethane
              value: business
            - label: Sanayi
              value: industrial
set_tariff_type:
  name: Tarife türünü ayarla
  description: Evin Akıllı Fatura hesaplamasında kullanılan tek veya üç zamanlı tarifeyi değiştirir.
  fields:
    device_id:
      name: Bu evdeki bir Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    tariff_type:
      name: Tarife
      required: true
      selector:
        select:
          options:
            - label: Tek zamanlı
              value: one-time
            - label: Üç zamanlı
              value: three-time
set_energy_management:
  name: Akıllı Fatura hesaplamasını aç veya kapat
  description: Vestel uygulamasındaki ev enerji yönetimi özelliğini açar veya kapatır; cihazları çalıştırmaz veya kapatmaz.
  fields:
    device_id:
      name: Bu evdeki bir Vestel cihazı
      required: true
      selector:
        device:
          integration: vestel_appliances
    enabled:
      name: Etkin
      required: true
      selector:
        boolean:
